<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c3a">
  <title>Bản đồ mưa Đà Nẵng · PBL6</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="/map.css">
  <link rel="stylesheet" href="/portal.css">
  <link rel="stylesheet" href="/explore.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script defer src="/portal.js"></script>
  <script defer src="/map.js"></script>
</head>
<body class="map-page">
  <main class="map-shell" aria-label="Bản đồ dự báo mưa">
    <div id="map" aria-label="Vị trí các trạm mưa">
      <p id="map-loading" role="status">Đang mở bản đồ trạm…</p>
    </div>
    <header class="map-top">
      <a class="map-brand" href="/">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Mưa Đà Nẵng <small>Dự báo tại trạm</small></span>
      </a>
      <div class="map-account">
        <a class="map-nav" href="/dashboard" id="monitor-link" hidden>Theo dõi</a>
        <a class="map-login" id="account-link" href="/login">Đăng nhập</a>
        <span id="account-name" hidden></span>
        <button class="map-nav" id="sign-out" type="button" hidden>Đăng xuất</button>
      </div>
    </header>
    <p id="load-error" role="alert" class="map-message notice" hidden></p>
    <p id="map-error" role="status" class="map-message notice" hidden></p>

    <section id="workspace" class="map-workspace" aria-label="Điều khiển bản đồ" hidden>
      <div class="map-toolbar">
        <button id="tools-toggle" class="map-tool" type="button" aria-controls="tools-panel" aria-expanded="false">
          <span class="menu-icon" aria-hidden="true"></span> Công cụ
        </button>
        <button id="fit-map" class="map-tool" type="button">Xem tất cả trạm</button>
      </div>

      <div class="map-state" aria-live="polite">
        <span id="map-mode" class="map-mode" data-mode="historical_replay">Phát lại lịch sử</span>
        <span id="mode-date"></span>
        <button id="latest-issue" type="button" class="map-latest" hidden>Xem lượt mới nhất</button>
      </div>

      <aside id="tools-panel" class="map-panel tools-panel" aria-labelledby="tools-title" hidden>
        <div class="panel-head">
          <h1 id="tools-title">Bản đồ lượng mưa</h1>
          <button id="close-tools" class="panel-close" type="button" aria-label="Thu gọn công cụ">×</button>
        </div>
        <label for="issue">Lần phát dự báo</label>
        <select id="issue"></select>
        <p id="issue-meta" class="source-caption"></p>
        <p id="layer-label" class="map-label">Lớp hiển thị</p>
        <div class="map-layers" role="group" aria-labelledby="layer-label">
          <button data-layer="lightgbm" style="--layer-color: #1387a0" type="button" aria-pressed="true">LightGBM</button>
          <button data-layer="gfs" style="--layer-color: #5f75ae" type="button" aria-pressed="false">GFS</button>
          <button data-layer="probability" style="--layer-color: #cb7e32" type="button" aria-pressed="false">Xác suất mưa ≥50 mm</button>
          <button data-layer="vrain" style="--layer-color: #30796c" type="button" aria-pressed="false" hidden>Vrain thực đo</button>
          <button data-layer="difference" style="--layer-color: #b2603d" type="button" aria-pressed="false" hidden>Sai lệch LightGBM − Vrain</button>
        </div>
        <section class="map-scan" aria-labelledby="scan-title">
          <div class="scan-heading">
            <h2 id="scan-title">Trạm nổi bật</h2>
            <span id="coverage"></span>
          </div>
          <ul id="scan-stations"></ul>
        </section>
        <div class="station-lookup">
          <label for="station">Chọn trạm</label>
          <select id="station"></select>
          <button id="open-station" class="map-tool" type="button">Xem</button>
        </div>
        <a class="map-secondary-link" id="export-forecast" href="/api/export.csv" hidden>Tải bảng của ngày đang xem ↓</a>
      </aside>

      <aside id="station-panel" class="map-panel station-panel station-card" aria-labelledby="station-title" hidden>
        <div class="panel-head">
          <div><p id="station-day" class="source-caption"></p><h2 id="station-title"></h2></div>
          <button id="close-station" class="panel-close" type="button" aria-label="Đóng thông tin trạm">×</button>
        </div>
        <div id="station-detail" aria-live="polite"></div>
        <figure id="station-chart" class="station-chart" aria-label="Lượng mưa ba ngày tại trạm" hidden></figure>
        <a class="map-secondary-link" id="station-verify" href="/dashboard" hidden>Xem thông tin đối chiếu →</a>
      </aside>

      <details id="map-legend" class="map-panel map-legend">
        <summary><strong id="legend-title">Dải lượng mưa</strong><span id="legend-unit">mm/24 giờ</span></summary>
        <ul id="legend-items" aria-label="Chú giải dải màu"></ul>
        <p id="legend-note"></p>
      </details>

      <section class="map-panel map-timeline" aria-label="Ba khoảng dự báo">
        <div class="timeline-summary">
          <h2 id="map-title">Lượng mưa dự báo · LightGBM</h2>
          <p id="period" aria-live="polite"></p>
        </div>
        <div class="timeline-days" role="group" aria-label="Chọn hạn dự báo">
          <button data-day="1" type="button" aria-pressed="true">Ngày 1 <small>0–24 giờ</small></button>
          <button data-day="2" type="button" aria-pressed="false">Ngày 2 <small>24–48 giờ</small></button>
          <button data-day="3" type="button" aria-pressed="false">Ngày 3 <small>48–72 giờ</small></button>
        </div>
      </section>
    </section>
  </main>
</body>
</html>

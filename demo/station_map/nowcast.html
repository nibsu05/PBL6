<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c3a">
  <title>Mưa 1–6 giờ tại trạm · PBL6</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="/nowcast.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script defer src="/nowcast.js"></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="/">Mưa Đà Nẵng</a>
    <nav aria-label="Nhánh dự báo">
      <a href="/cuc-ngan" aria-current="page">1–6 giờ</a>
      <a href="/">1–3 ngày</a>
    </nav>
    <a class="account" id="nowcast-account" href="/login">Đăng nhập</a>
  </header>
  <main class="layout">
    <section class="map-view" aria-label="Bản đồ các trạm có dự báo theo giờ">
      <div id="nowcast-map"></div>
      <p class="map-message" id="nowcast-map-message" hidden></p>
      <div class="map-mode"><span class="mode-dot" aria-hidden="true"></span> Phát lại lịch sử</div>
      <div class="legend" aria-label="Lượng mưa dự báo tính bằng mm trong một giờ">
        <b>mm trong 1 giờ</b>
        <span><i class="dry"></i>&lt;0,1</span>
        <span><i class="light"></i>0,1–&lt;1</span>
        <span><i class="wet"></i>1–&lt;5</span>
        <span><i class="strong"></i>5–&lt;10</span>
        <span><i class="heavy"></i>≥10</span>
        <span><i class="missing"></i>Thiếu</span>
      </div>
    </section>
    <aside class="panel" aria-labelledby="nowcast-title">
      <h1 id="nowcast-title">Mưa trong 6 giờ tới</h1>
      <p class="muted" id="nowcast-status" role="status">Đang đọc các lượt đã lưu…</p>
      <div id="nowcast-controls" hidden>
        <div class="controls">
          <label>Lượt dự báo<select id="nowcast-issue"></select></label>
          <label>Mô hình<select id="nowcast-method"></select></label>
        </div>
        <div class="time-heading"><b>Giờ đích</b><span id="nowcast-lead"></span></div>
        <input id="nowcast-slider" type="range" min="1" max="6" step="1" value="1" aria-label="Chọn giờ dự báo">
        <div id="nowcast-hours" class="hours" role="group" aria-label="Chọn khoảng dự báo"></div>
        <p id="nowcast-window" class="validity" aria-live="polite"></p>
        <section id="nowcast-detail" class="detail" aria-labelledby="nowcast-station" hidden>
          <div class="section-head">
            <h2 id="nowcast-station"></h2>
            <button type="button" id="nowcast-close" class="close" aria-label="Đóng chi tiết trạm">×</button>
          </div>
          <div id="nowcast-station-hours"></div>
        </section>
        <section aria-labelledby="nowcast-list-title">
          <div class="section-head">
            <h2 id="nowcast-list-title">Dự báo theo trạm</h2>
            <span id="nowcast-coverage" class="coverage"></span>
          </div>
          <div class="controls filters">
            <input id="nowcast-search" type="search" aria-label="Tìm trạm" placeholder="Tên hoặc mã trạm">
            <select id="nowcast-filter" aria-label="Lọc lượng mưa">
              <option value="0">Tất cả trạm</option>
              <option value="0.1">Có mưa ≥0,1 mm</option>
              <option value="1">Có mưa ≥1 mm</option>
              <option value="5">Có mưa ≥5 mm</option>
            </select>
          </div>
          <ul id="nowcast-list" class="station-list"></ul>
        </section>
      </div>
    </aside>
  </main>
</body>
</html>
